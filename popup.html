<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tab groups as Workspaces</title>
  <style>
    body {
      min-width: 260px;
      margin: 0;
      padding: 12px;
      font: 13px/1.5 system-ui, sans-serif;
      color: #202124;
    }
    .buttons,
    .groups {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .groups {
      gap: 4px;
      margin-top: 8px;
    }
    .groups[hidden] {
      display: none;
    }
    .groups-title {
      margin: 0 0 2px;
      font-size: 12px;
      font-weight: 500;
      color: #5f6368;
    }
    .group-empty {
      margin: 0;
      font-size: 12px;
      color: #5f6368;
    }
    button {
      padding: 8px 12px;
      font: inherit;
      text-align: center;
      border-radius: 4px;
      border: 1px solid #dadce0;
      background: #fff;
      cursor: pointer;
    }
    button:hover {
      filter: brightness(0.95);
    }
    button.primary {
      background: #1a73e8;
      border-color: #1a73e8;
      color: #fff;
    }
    button.danger {
      background: #d93025;
      border-color: #d93025;
      color: #fff;
    }
    .group-button {
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
    }
    .group-button .swatch {
      flex: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .group-button .title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="buttons">
    <button id="group" class="primary" type="button">Group</button>
    <button id="ungroup" class="danger" type="button">Ungroup</button>
    <button id="group-to" type="button">Group To…</button>
  </div>

  <div id="groups" class="groups" hidden></div>

  <script src="popup.js"></script>
</body>
</html>
